<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaglerNode - Web Client Panel</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            margin-bottom: 2rem;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
        }
        input {
            width: 100%;
            padding: 0.85rem;
            margin: 0.5rem 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        #game-container {
            width: 100%;
            max-width: 900px;
            height: 500px;
            display: none;
            border: 2px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container" id="setup-box">
        <h2>Eaglercraft Web Player Portal</h2>
        <p>Enter your target server WebSocket address below to connect instantly through the web client wrapper.</p>
        
        <label for="server-ip"><strong>Server WebSocket URL</strong></label>
        <input type="text" id="server-ip" placeholder="wss://://example.com">

        <button class="btn" onclick="launchClient()">Launch Web Client</button>
    </div>

    <!-- Client Frame Container -->
    <div id="game-container">
        <iframe id="client-frame" src=""></iframe>
    </div>

    <script>
        function launchClient() {
            const rawUrl = document.getElementById('server-ip').value.trim();
            if (!rawUrl) {
                alert('Please enter a server address.');
                return;
            }

            // Standard public client loader wrapper
            // Replace with your preferred open-source client repository link if needed
            const clientLoaderBase = "https://github.io"; 
            
            // Appends the server URI parameter to force-inject the server into the client list
            const finalGameUrl = `${clientLoaderBase}?server=${encodeURIComponent(rawUrl)}`;

            // Hide the configuration layout and expand the game display frame
            document.getElementById('setup-box').style.display = 'none';
            const container = document.getElementById('game-container');
            const frame = document.getElementById('client-frame');
            
            frame.src = finalGameUrl;
            container.style.display = 'block';
        }
    </script>
</body>
</html>
