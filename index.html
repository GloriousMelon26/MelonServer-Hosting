<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaglerNode - Super Simple Deploy</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #fff;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        label {
            display: block;
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #3b82f6;
        }
        input {
            width: 100%;
            padding: 0.85rem;
            margin: 0.5rem 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #0f172a;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            word-break: break-all;
            display: none;
        }
        code {
            font-family: monospace;
            color: #60a5fa;
            font-size: 1.1rem;
            display: block;
            margin-top: 0.5rem;
            background: #1e293b;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>One-Click Server Address Generator</h2>
        <p>Just enter your GitHub Codespace Name (e.g., <code>musical-space-waddle-q7967v64xx34p4x</code>) found in your browser URL bar or dashboard.</p>
        
        <label for="codespace-id">Codespace Name/ID</label>
        <input type="text" id="codespace-id" placeholder="Enter codespace name here...">

        <button class="btn" onclick="generateAddress()">Get Server Address</button>

        <div id="result-box" class="result">
            <strong>Your Eaglercraft Server Address:</strong>
            <code id="server-address"></code>
            <p style="font-size: 0.85rem; margin-top: 0.75rem; color: #64748b; margin-bottom: 0;">Copy this address directly into your Eaglercraft multiplayer server list!</p>
        </div>
    </div>

    <script>
        function generateAddress() {
            const rawId = document.getElementById('codespace-id').value.trim();
            const resultBox = document.getElementById('result-box');
            const serverAddress = document.getElementById('server-address');

            if (!rawId) {
                alert('Please enter a valid Codespace name.');
                return;
            }

            // Automatically strips away accidental full URLs or duplicate ports if pasted
            let cleanId = rawId.replace('https://', '')
                             .replace('.app.github.dev', '')
                             .replace('-8081', '');
            
            // Extract just the main subdomain if a full URL was provided
            if (cleanId.includes('.')) {
                cleanId = cleanId.split('.')[0];
            }

            // Construct standard GitHub Codespaces public proxy template format
            const finalUri = `wss://${cleanId}-8081.app.github.dev`;

            serverAddress.innerText = finalUri;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
